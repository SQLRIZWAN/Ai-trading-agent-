name: Demo Trade Executor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  demo-trades:
    name: Execute Demo (Paper) Trades
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Execute demo trades
        run: python scripts/trading/demo_engine.py --mode execute
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DEMO_CONFIDENCE: ${{ vars.MIN_DEMO_CONFIDENCE || '70' }}
          DEMO_INITIAL_BALANCE: ${{ vars.DEMO_INITIAL_BALANCE || '10000' }}
